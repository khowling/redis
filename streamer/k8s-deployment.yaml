apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-stream-app
  labels:
    app: redis-stream-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-stream-app
  template:
    metadata:
      labels:
        app: redis-stream-app
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: redis-stream-app-sa
      # Schedule on high-performance F8as_v6 nodes
      nodeSelector:
        vm-type: f8as-v6
      tolerations:
      - key: workload
        operator: Equal
        value: compute
        effect: NoSchedule
      containers:
      - name: redis-client
        image: kharc.azurecr.io/redis-streamer:0.5 # 5000-message batches for maximum throughput
        ports:
        - containerPort: 8080
        env:
        # Load common configuration from ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: ENVIRONMENT
        - name: REDIS_USE_AAD
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: REDIS_USE_AAD
        - name: REDIS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: REDIS_ENDPOINT
        - name: REDIS_MAX_RETRIES
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: REDIS_MAX_RETRIES
        - name: REDIS_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: REDIS_POOL_SIZE
        - name: REDIS_DIAL_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: REDIS_DIAL_TIMEOUT
        
        # Stream configuration
        - name: REDIS_STREAM_MAXLEN
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: REDIS_STREAM_MAXLEN
        
        # Azure Managed Identity Configuration (from ConfigMap)
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: AZURE_CLIENT_ID
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: AZURE_TENANT_ID
        - name: REDIS_USERNAME
          valueFrom:
            configMapKeyRef:
              name: redis-stream-app-config
              key: REDIS_USERNAME
        
        # Redis cluster mode configuration
        - name: REDIS_ENABLE_CLUSTER
          value: "true"              # Enable cluster mode for Azure Redis
        
        # Additional Redis performance tuning for 200k+ msg/sec throughput (5000 msg batches)
        - name: REDIS_READ_TIMEOUT
          value: "5s"             # Increased for 5000-message batches to prevent I/O timeouts
        - name: REDIS_WRITE_TIMEOUT
          value: "5s"             # Increased for 5000-message batches to prevent I/O timeouts
        - name: REDIS_POOL_TIMEOUT
          value: "1s"             # Increased pool acquisition timeout
        - name: REDIS_IDLE_TIMEOUT
          value: "15m"            # Longer connection reuse
        - name: REDIS_MAX_CONN_AGE
          value: "60m"            # Longer connection lifecycle
        - name: REDIS_MIN_IDLE_CONNS
          value: "50"             # More warm connections (was 25)
        
        # Go runtime optimization for 200k+ msg/sec throughput
        - name: GOMAXPROCS
          value: "3"              # Match CPU allocation
        - name: GOGC
          value: "400"            # Much less aggressive GC (was 200)
        - name: GOMEMLIMIT
          value: "9GiB"           # Memory limit
        - name: GODEBUG
          value: "gctrace=0,madvdontneed=1,scavtrace=0"  # Optimize memory behavior

        resources:
          requests:
            memory: "10Gi"        # High memory for caching and buffers
            cpu: "3000m"          # 3 dedicated physical cores
          limits:
            memory: "12Gi"        # Allow some memory bursting
            cpu: "3500m"          # Allow slight CPU bursting but stay within node capacity
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Volume mounts for workload identity
        volumeMounts:
        - name: azure-identity-token
          mountPath: /var/run/secrets/azure/tokens
          readOnly: true
      
      volumes:
      - name: azure-identity-token
        projected:
          sources:
          - serviceAccountToken:
              path: azure-identity-token
              expirationSeconds: 3600
              audience: api://AzureADTokenExchange

---
apiVersion: v1
kind: Service
metadata:
  name: redis-stream-app-service
  labels:
    app: redis-stream-app
spec:
  selector:
    app: redis-stream-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-stream-app-sa
  annotations:
    azure.workload.identity/client-id: "e5833ec1-dc2b-471c-a883-a9e8544b2efa" # User Managed Identity Client ID
  labels:
    azure.workload.identity/use: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-stream-app-config
data:
  ENVIRONMENT: "production"
  REDIS_USE_AAD: "true"
  REDIS_MAX_RETRIES: "3"
  REDIS_POOL_SIZE: "300"          # Massive pool for 200k+ throughput (was 150)
  REDIS_DIAL_TIMEOUT: "1s"        # Fast connection establishment
  REDIS_STREAM_MAXLEN: "2000000"  # 2 million messages per stream
  
  REDIS_ENDPOINT: "khredis.westeurope.redis.azure.net:10000"  
  # Azure Managed Identity Configuration
  AZURE_CLIENT_ID: "7303e014-4009-403f-b170-83ef57374e21"  # User Managed Identity Object ID
  AZURE_TENANT_ID: "MngEnvMCAP134668.onmicrosoft.com"      # Azure Tenant ID
  REDIS_USERNAME: "7303e014-4009-403f-b170-83ef57374e21"   # Object ID for Redis ACL
