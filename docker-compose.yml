version: '3.8'

services:
  # Redis Streamer (Producer)
  redis-streamer:
    build: 
      context: ./streamer
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis-local
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - REDIS_POOL_SIZE=50
      - REDIS_MAX_RETRIES=3
    depends_on:
      - redis-local
    networks:
      - redis-network

  # Redis Query API (Consumer)
  redis-query-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis-local
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - REDIS_POOL_SIZE=20
      - REDIS_MAX_RETRIES=3
    ports:
      - "8081:8081"
    depends_on:
      - redis-local
    networks:
      - redis-network

  # Local Redis instance for development/testing
  redis-local:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - redis-network

  # Redis Commander for GUI management (moved to different port)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis-local:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis-local
    networks:
      - redis-network

volumes:
  redis_data:

networks:
  redis-network:
    driver: bridge
