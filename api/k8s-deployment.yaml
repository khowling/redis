apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-query-api
  labels:
    app: redis-query-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-query-api
  template:
    metadata:
      labels:
        app: redis-query-api
    spec:
      serviceAccountName: redis-query-api-sa
      # Schedule on high-performance F8as_v6 nodes
      nodeSelector:
        vm-type: f8as-v6
      tolerations:
      - key: workload
        operator: Equal
        value: compute
        effect: NoSchedule
      containers:
      - name: redis-query-api
        image: kharc.azurecr.io/redis-api:0.5  # Updated with timestamp index support
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: ENVIRONMENT
        - name: REDIS_USE_AAD
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: REDIS_USE_AAD
        - name: REDIS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: REDIS_ENDPOINT
        - name: REDIS_MAX_RETRIES
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: REDIS_MAX_RETRIES
        - name: REDIS_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: REDIS_POOL_SIZE
        - name: REDIS_DIAL_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: REDIS_DIAL_TIMEOUT
        
        # Stream configuration
        - name: REDIS_STREAM_MAXLEN
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: REDIS_STREAM_MAXLEN
        
        # Azure Managed Identity Configuration (from ConfigMap)
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: AZURE_CLIENT_ID
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: AZURE_TENANT_ID
        - name: REDIS_USERNAME
          valueFrom:
            configMapKeyRef:
              name: redis-api-app-config
              key: REDIS_USERNAME
        
        # Redis cluster mode configuration
        - name: REDIS_ENABLE_CLUSTER
          value: "true"              # Enable cluster mode for Azure Redis
        
        resources:
          requests:
            memory: "10Gi"
            cpu: "5000m"
          limits:
            memory: "12Gi"
            cpu: "10000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: redis-query-api-service
  labels:
    app: redis-query-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: redis-query-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-query-api-sa
  annotations:
    azure.workload.identity/client-id: "7303e014-4009-403f-b170-83ef57374e21"
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-api-app-config
data:
  ENVIRONMENT: "production"
  REDIS_USE_AAD: "true"
  REDIS_MAX_RETRIES: "3"
  REDIS_POOL_SIZE: "300"          # Massive pool for 200k+ throughput (was 150)
  REDIS_DIAL_TIMEOUT: "1s"        # Fast connection establishment
  REDIS_ENDPOINT: "khredis.westeurope.redis.azure.net:10000"
  REDIS_STREAM_MAXLEN: "2000000"  # 2 million messages per stream
  
  # Azure Managed Identity Configuration
  AZURE_CLIENT_ID: "7303e014-4009-403f-b170-83ef57374e21"  # User Managed Identity Object ID
  AZURE_TENANT_ID: "MngEnvMCAP134668.onmicrosoft.com"      # Azure Tenant ID
  REDIS_USERNAME: "7303e014-4009-403f-b170-83ef57374e21"   # Object ID for Redis ACL
